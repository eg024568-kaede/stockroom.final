<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom – Admin login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f3f5f2; --card:#fff; --ink:#17302b; --muted:#5d716c; --line:#d9e0dc; --brand:#1f6f5c; --brand-dark:#165244; --danger:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:400 15px/1.5 "Public Sans", system-ui, sans-serif; padding:20px; }
  .card { width:min(400px,100%); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px 28px; box-shadow:0 10px 30px rgba(23,48,43,.08); }
  h1 { font-family:"Bricolage Grotesque","Public Sans",sans-serif; font-size:32px; margin:0; letter-spacing:-0.02em; }
  p.sub { color:var(--muted); margin:4px 0 24px; }
  form { display:grid; gap:14px; }
  label { display:grid; gap:4px; font-size:13px; font-weight:500; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; width:100%; color:var(--ink); background:#fff; }
  input:focus-visible, button:focus-visible { outline:3px solid #8cc9b9; outline-offset:1px; }
  button { font:inherit; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; border:1px solid var(--brand); border-radius:8px; padding:10px 14px; }
  button:hover { background:var(--brand-dark); }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin:0; }
</style>
</head>
<body>
<main class="card">
  <h1>Stockroom</h1>
  <p class="sub">Administrator sign in</p>
  <form id="form">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="btn">Sign in</button>
  </form>
</main>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, btn = document.getElementById('btn'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value, password: f.password.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed.');
    window.location.href = '/';
  } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
});
</script>
</body>
</html>
